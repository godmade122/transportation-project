<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book a Ride | Safety Ride</title>

  <link rel="stylesheet" href="booking.css">
</head>


<body>

  <!-- HEADER -->
  <header class="header">

    <a href="index.html" class="logo">
      SafeRide
    </a>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="booking.html" class="active">Book a Ride</a>
      <a href="my-bookings.html">My Bookings</a>
    </nav>

  </header>


  <!-- MAIN -->
  <main class="page-container">

    <!-- BOOKING FORM -->
    <section class="booking-section">

      <div class="page-title">

        <h1>Book Your Ride</h1>

        <p>
          Fill in your travel details to book a safe and comfortable ride.
        </p>

      </div>


      <form id="bookingForm" class="booking-form">

        <!-- RIDE TYPE -->
        <div class="form-group">

          <label for="rideType">
            Select Ride Type
          </label>

          <select id="rideType" required>

            <option value="">
              Choose a ride
            </option>

            <option value="Standard Ride">
              Standard Ride
            </option>

            <option value="Premium Ride">
              Premium Ride
            </option>

            <option value="Airport Shuttle">
              Airport Shuttle
            </option>

            <option value="Executive Hilux">
             Executive Hilux
            </option>

            <option value="Luxury Hilux">
             Luxury Hilux
            </option>

            <option value="Sprinter Van">
             Sprinter Van
            </option>

          </select>

        </div>

        <!-- PICKUP -->
        <div class="form-group">

          <label for="pickupLocation">
            Pickup Location
          </label>

          <input
            type="text"
            id="pickupLocation"
            placeholder="Enter your pickup location"
            required
          >

        </div>


        <!-- DESTINATION -->
        <div class="form-group">

          <label for="destination">
            Destination
          </label>

          <input
            type="text"
            id="destination"
            placeholder="Where are you going?"
            required
          >

        </div>


        <!-- DATE AND TIME -->
        <div class="form-row">

          <div class="form-group">

            <label for="travelDate">
              Travel Date
            </label>

            <input
              type="date"
              id="travelDate"
              required
            >

          </div>


          <div class="form-group">

            <label for="travelTime">
              Travel Time
            </label>

            <input
              type="time"
              id="travelTime"
              required
            >

          </div>

        </div>


        <!-- PASSENGERS -->
        <div class="form-group">

          <label for="passengers">
            Number of Passengers
          </label>

          <input
            type="number"
            id="passengers"
            placeholder="Enter number of passengers"
            min="1"
            required
          >

        </div>


        <!-- HIDDEN PRICE ID -->
        <input
          type="hidden"
          id="priceId"
        >


        <!-- BUTTON -->
        <button type="submit" class="book-btn">
          Create Booking
        </button>

      </form>

    </section>


    <!-- BOOKING RESULT -->
    <section
      id="bookingResult"
      class="booking-result"
      style="display: none;"
    >

      <div class="success-icon">
        ✓
      </div>

      <h2>Booking Created Successfully!</h2>

      <p>
        Your booking has been created successfully.
      </p>


      <div class="price-box">

        <span>Your Ride Price</span>

        <h1 id="bookingPrice">
          ₦0
        </h1>

      </div>


      <!-- PAYMENT -->
      <button
        id="proceedPayment"
        class="payment-btn"
      >
        Proceed to Payment
      </button>


      <a
        href="my-bookings.html"
        class="view-bookings-btn"
      >
        View My Bookings
      </a>

    </section>

  </main>


  <!-- FOOTER -->
  <footer>

    <p>
      © 2026 Safety Ride. All rights reserved.
    </p>

  </footer>


  <!-- JAVASCRIPT -->
  <script src="js/booking.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>

</body>

</html>
